<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>253 Herron Mews Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="row mb-4">
            <div class="col-md-6">
                <h2>🏡 253 Herron Mews Tracker</h2>
            </div>
            <div class="col-md-6 text-end">
                <div class="btn-group" role="group">
                    <button class="btn btn-outline-primary active" id="btnMain" onclick="switchUnit('main')">Main Floor</button>
                    <button class="btn btn-outline-primary" id="btnBasement" onclick="switchUnit('basement')">Basement Suite</button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm p-4 mb-4">
            <h4 id="unitTitle">Main Floor Expenses</h4>
            <hr>
            <div id="contentArea">Loading data...</div>
        </div>

        <div class="card shadow-sm p-4">
            <h4>Add Expense</h4>
            <form id="expenseForm" onsubmit="addExpense(event)">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Description</label>
                        <input type="text" id="desc" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Amount ($)</label>
                        <input type="number" step="0.01" id="amount" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Category</label>
                        <select id="category" class="form-select">
                            <option value="Groceries">Groceries</option>
                            <option value="Household">Household</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Paid By</label>
                        <input type="text" id="paidBy" class="form-control" placeholder="Name" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Date</label>
                        <input type="date" id="date" class="form-control" required>
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Add</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentUnit = 'main';
        let appData = { expenses: [], basement_expenses: [] };

        async function loadData() {
            let res = await fetch('/api/data');
            appData = await res.json();
            render();
        }

        function switchUnit(unit) {
            currentUnit = unit;
            document.getElementById('btnMain').className = unit === 'main' ? 'btn btn-outline-primary active' : 'btn btn-outline-primary';
            document.getElementById('btnBasement').className = unit === 'basement' ? 'btn btn-outline-primary active' : 'btn btn-outline-primary';
            document.getElementById('unitTitle').innerText = unit === 'main' ? 'Main Floor Expenses' : 'Basement Suite Expenses';
            render();
        }

        function render() {
            let list = currentUnit === 'main' ? appData.expenses : appData.basement_expenses;
            let html = `<table class="table table-striped"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Paid By</th><th>Amount</th><th>Action</th></tr></thead><tbody>`;
            if(list.length === 0) {
                html += `<tr><td colspan="6" class="text-center">No expenses recorded.</td></tr>`;
            } else {
                list.forEach(e => {
                    html += `<tr><td>${e.date}</td><td>${e.description}</td><td>${e.category}</td><td>${e.paidBy || '-'}</td><td>$${e.amount}</td><td><button class="btn btn-danger btn-sm" onclick="deleteExp('${e.id}')">Delete</button></td></tr>`;
                });
            }
            html += `</tbody></table>`;
            document.getElementById('contentArea').innerHTML = html;
        }

        async function addExpense(e) {
            e.preventDefault();
            let payload = {
                unit: currentUnit,
                description: document.getElementById('desc').value,
                amount: document.getElementById('amount').value,
                category: document.getElementById('category').value,
                paidBy: document.getElementById('paidBy').value,
                date: document.getElementById('date').value
            };
            await fetch('/api/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            document.getElementById('expenseForm').reset();
            loadData();
        }

        async function deleteExp(id) {
            await fetch('/api/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({unit: currentUnit, id: id}) });
            loadData();
        }

        document.getElementById('date').valueAsDate = new Date();
        loadData();
    </script>
</body>
</html>
